<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セルフィール新宿・予約システム</title>
  <style>
    :root {
      --gold: #b8a07e;
      --dark-gold: #8a7a66;
      --bg-creme: #fdfaf5;
      --text: #4a4a4a;
      --line-green: #06C755;
    }
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: #f8f7f2;
      color: var(--text);
      padding: 10px;
      line-height: 1.6;
    }
    .container {
      max-width: 650px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.05);
    }
    h2 {
      text-align: center;
      color: var(--gold);
      border-bottom: 2px solid #f0ece4;
      padding-bottom: 15px;
      font-weight: 300;
      letter-spacing: 2px;
      margin-top: 0;
    }
    .section {
      margin-bottom: 30px;
      padding: 20px;
      border: 1px solid #f0ece4;
      border-radius: 15px;
      background: white;
      position: relative;
    }
    .step-title {
      font-size: 1.1em;
      font-weight: bold;
      color: var(--dark-gold);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
    }
    .step-badge {
      background: var(--gold);
      color: white;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      margin-right: 12px;
      font-size: 0.85em;
      flex-shrink: 0;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #777;
      font-size: 0.85em;
    }
    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .category-label {
      font-size: 0.78em;
      font-weight: bold;
      color: var(--dark-gold);
      letter-spacing: 1px;
      margin: 16px 0 6px;
      padding: 4px 10px;
      background: var(--bg-creme);
      border-radius: 6px;
      display: inline-block;
    }

    /* ==============================
       コースカード
    ============================== */
    .item-card {
      display: flex;
      align-items: flex-start;
      padding: 14px 15px;
      border: 1px solid #f2f2f2;
      margin-bottom: 6px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
      border-left: 6px solid transparent;
      position: relative;
    }
    .item-card:hover:not(.disabled) {
      background-color: #fdfaf5;
      border-color: #eaddca;
    }
    .selected {
      border-left-color: var(--gold) !important;
      background-color: var(--bg-creme) !important;
      border-color: #eaddca !important;
    }
    /* グレーアウトは非表示に（display:noneで完全に消す） */
    .disabled { display: none !important; }

    /* ==============================
       オプションカード（コースより小さく・色違い）
    ============================== */
    .option-card {
      padding: 10px 14px;
      border-radius: 10px;
      background-color: #f7f4f0;
      border: 1px solid #ede8e0;
      border-left: 6px solid transparent;
    }
    .option-card:hover:not(.disabled) {
      background-color: #f0ebe3;
      border-color: #ddd0c0;
    }
    .option-card.selected {
      border-left-color: var(--dark-gold) !important;
      background-color: #efe9de !important;
      border-color: #d4c5b0 !important;
    }

    .card-left { flex: 1; min-width: 0; }

    /* 料金行：等幅フォントで右揃え */
    .time-price-row {
      display: flex;
      align-items: baseline;
      margin-top: 3px;
      font-size: 0.85em;
      color: #888;
      gap: 0;
    }
    .time-col {
      /* 時間部分：固定幅で左側 */
      min-width: 90px;
      flex-shrink: 0;
    }
    .price-col {
      /* 料金部分：右寄せ */
      text-align: right;
      flex: 1;
      font-weight: bold;
    }
    .price-normal { color: var(--gold); }
    .price-first  { color: #e8453c; }
    .price-original {
      font-size: 0.85em;
      color: #bbb;
      text-decoration: line-through;
      margin-right: 4px;
    }

    .desc-tag {
      font-size: 0.82em;
      color: #7aab8a;
      display: block;
      margin-top: 4px;
    }

    /* オプションカード内は少し小さく */
    .option-card .time-price-row { font-size: 0.82em; }
    .option-card b { font-size: 0.95em; }

    /* ---- おすすめバッジ ---- */
    .badge {
      display: inline-block;
      font-size: 0.68em;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 20px;
      margin-left: 7px;
      vertical-align: middle;
      white-space: nowrap;
    }
    .badge-popular { background: #e8453c; color: white; }
    .badge-first   { background: #4a90d9; color: white; }
    .badge-value   { background: #f5a623; color: white; }

    /* ---- 合計エリア ---- */
    .total-area {
      background: var(--bg-creme);
      padding: 25px;
      border-radius: 15px;
      border: 1px solid #eaddca;
      text-align: center;
      margin-top: 25px;
    }

    /* ---- ボタン ---- */
    .submit-btn {
      width: 100%;
      padding: 20px;
      background: linear-gradient(135deg, #d4af37, #b8a07e);
      color: white;
      border: none;
      border-radius: 40px;
      font-size: 1.15em;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(184,160,126,0.3);
    }
    .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .copy-btn { background: #4a4a4a; margin-top: 10px; }
    .line-btn {
      width: 100%;
      padding: 18px;
      background: var(--line-green);
      color: white;
      border: none;
      border-radius: 40px;
      font-size: 1.1em;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(6,199,85,0.3);
      text-decoration: none;
    }
    .line-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .line-icon {
      width: 28px; height: 28px;
      background: white;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
      flex-shrink: 0;
    }
    .back-btn {
      width: 100%;
      padding: 15px;
      background: white;
      color: var(--dark-gold);
      border: 1px solid var(--gold);
      border-radius: 40px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 20px;
    }

    /* ---- サマリー ---- */
    .summary-box {
      background: #faf9f5;
      padding: 20px;
      border-radius: 10px;
      border: 1px dashed #dcd8c0;
      margin-bottom: 10px;
      font-size: 0.95em;
      white-space: pre-wrap;
      color: #333;
      text-align: left;
    }
    .sheet-frame, .form-frame {
      width: 100%;
      border: 1px solid #eee;
      border-radius: 12px;
      margin-top: 15px;
      background: #fff;
      height: 500px;
    }
    .form-frame { height: 900px; }
    .loading-msg {
      text-align: center;
      color: #aaa;
      font-size: 0.9em;
      padding: 20px;
    }
    .error-msg {
      text-align: center;
      color: #e74c3c;
      font-size: 0.9em;
      padding: 20px;
    }

    /* ---- 初回バナー ---- */
    .first-banner {
      background: linear-gradient(135deg, #4a90d9, #357abd);
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 0.9em;
      display: none;
    }
    .first-banner b { font-size: 1.05em; }

    /* ---- オプション見出し ---- */
    .option-section-label {
      font-size: 0.8em;
      font-weight: bold;
      color: var(--dark-gold);
      letter-spacing: 1px;
      margin: 16px 0 8px;
      padding: 5px 12px;
      background: #f0ebe3;
      border-radius: 6px;
      display: inline-block;
      border-left: 3px solid var(--dark-gold);
    }
  </style>
</head>
<body>

<div class="container">
  <h2>セルフィール新宿・予約システム</h2>

  <!-- STEP 1 -->
  <div id="step1">
    <div class="section">
      <div class="step-title"><span class="step-badge">1</span>お客様情報をご入力ください（必須）</div>
      <select id="userStatus" onchange="handleStatusChange()">
        <option value="">セルフィール新宿のご利用は？</option>
        <option value="はじめて">はじめて</option>
        <option value="2回目">2回目</option>
        <option value="3回目以上">3回目以上</option>
      </select>
      <input type="number" id="userAge" placeholder="年齢" min="1" max="99" oninput="filterList()">
      <select id="gender" onchange="handleGenderChange()">
        <option value="">性別を選択（必須）</option>
        <option value="男性">男性</option>
        <option value="女性">女性</option>
      </select>
    </div>

    <div class="section">
      <div class="step-title"><span class="step-badge">2</span>メニューをお選びください</div>

      <div class="first-banner" id="firstBanner">
        👋 <b>はじめてのお客様限定</b>　初回特別価格でご案内しています！<br>
        <span style="font-size:0.9em;opacity:0.9;">✨マークのコースが対象です</span>
      </div>

      <label>コースを選択（複数選択可）</label>
      <div id="courseList"><div class="loading-msg">性別を選択してください</div></div>

      <div id="optionSection" style="display:none;">
        <div class="option-section-label">＋ オプションを追加（任意）</div>
        <div id="optionList"></div>
      </div>
      <div id="optionPlaceholder"><div class="loading-msg">コースを選択するとオプションが表示されます</div></div>
    </div>

    <div class="total-area">
      <div style="font-size:1.25em;font-weight:bold;">
        合計時間: <span id="displayTime">0分</span> / 料金: ¥<span id="displayPrice">0</span>
      </div>
      <button class="submit-btn" style="margin-top:15px;" onclick="goToStep2()">
        空き状況の確認へ進む
      </button>
    </div>
  </div>

  <!-- STEP 2 -->
  <div id="step2" style="display:none;">
    <div class="section">
      <div class="step-title"><span class="step-badge">A</span>予約内容をコピー / LINEで送る</div>
      <div id="summaryText" class="summary-box"></div>
      <button class="submit-btn copy-btn" onclick="copyToClipboard()">📋 予約内容をコピー</button>
      <a id="lineShareBtn" class="line-btn" href="#" target="_blank">
        <span class="line-icon">💬</span>LINEで予約内容を送る
      </a>
      <button class="back-btn" onclick="backToStep1()">⬅ メニューを選び直す</button>
    </div>
    <div class="section">
      <div class="step-title"><span class="step-badge">B</span>空き状況を確認</div>
      <iframe class="sheet-frame"
        src="https://script.google.com/macros/s/AKfycbx7yHB6hNPwjoxVxIhnTAFDxZe43e_dFAGHSpUGXrIJauBKsQl0f7mh60YDjEy-gx63/exec">
      </iframe>
    </div>
    <div class="section">
      <div class="step-title"><span class="step-badge">C</span>予約フォームへ貼り付けて送信</div>
      <iframe class="form-frame" src="https://ws.formzu.net/sfgen/S967546633/"></iframe>
    </div>
  </div>
</div>

<script>
  let masterData     = { courses: [], options: [] };
  let selectedCourses = [];
  let selectedOptions = [];

  const GAS_URL  = "https://script.google.com/macros/s/AKfycbwU2U7VUlN6vYBbZ9c4VxEVP0VTf7Uy8lyT0vX9Ie1RhnBnE7n0sdZOnPG9_uHX9TNd/exec";
  const LINE_URL = "https://lin.ee/o1HjTAv";

  function normalize(str) {
    return String(str || "").replace(/\s+/g, "").trim();
  }

  window.onload = () => {
    fetch(GAS_URL)
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          document.getElementById('courseList').innerHTML =
            '<div class="error-msg">エラー: ' + data.error + '</div>';
          return;
        }
        masterData = data;
        filterList();
      })
      .catch(err => {
        document.getElementById('courseList').innerHTML =
          '<div class="error-msg">データの取得に失敗しました。再読み込みしてください。<br><small>' + err + '</small></div>';
      });
  };

  function handleStatusChange() {
    const isFirst = document.getElementById('userStatus').value === 'はじめて';
    document.getElementById('firstBanner').style.display = isFirst ? 'block' : 'none';
    filterList();
  }

  function handleGenderChange() {
    selectedCourses = [];
    selectedOptions = [];
    filterList();
  }

  function buildBadge(badgeVal) {
    if (!badgeVal) return '';
    const v = normalize(badgeVal);
    if (v === '人気') return '<span class="badge badge-popular">🔥 人気No.1</span>';
    if (v === '初回') return '<span class="badge badge-first">👋 初回限定価格</span>';
    if (v === 'NEW') return '<span class="badge badge-value">⭐ NEW!!</span>';
    return '';
  }

  function buildCardInner(item, isFirst) {
    const { name, time, price, desc, badge, firstPrice } = item;
    const timeStr  = formatTimeDisplay(time);
    const badgeHtml = buildBadge(badge);
    const descHtml  = desc ? `<span class="desc-tag">＊${desc}</span>` : '';

    let priceHtml = '';
    if (isFirst && firstPrice && firstPrice < price) {
      priceHtml = `<span class="price-original">¥${price.toLocaleString()}</span><span class="price-first">✨ ¥${firstPrice.toLocaleString()}</span>`;
    } else {
      priceHtml = `<span class="price-normal">¥${price.toLocaleString()}</span>`;
    }

    return `
      <div class="card-left">
        <b>${name}</b>${badgeHtml}
        <div class="time-price-row">
          <span class="time-col">${timeStr}</span>
          <span class="price-col">${priceHtml}</span>
        </div>
        ${descHtml}
      </div>`;
  }

  function filterList() {
    const gender  = document.getElementById('gender').value;
    const age     = parseInt(document.getElementById('userAge').value) || 0;
    const isFirst = document.getElementById('userStatus').value === 'はじめて';
    const clist   = document.getElementById('courseList');
    const olist   = document.getElementById('optionList');
    const oSection     = document.getElementById('optionSection');
    const oPlaceholder = document.getElementById('optionPlaceholder');

    if (!gender) {
      clist.innerHTML = '<div class="loading-msg">性別を選択してください</div>';
      oSection.style.display     = 'none';
      oPlaceholder.style.display = 'block';
      oPlaceholder.innerHTML     = '<div class="loading-msg">コースを選択するとオプションが表示されます</div>';
      updateTotal();
      return;
    }

    const bannedItems = new Set();
    selectedCourses.forEach(sc => {
      (sc.data.exclusive || []).forEach(ex => bannedItems.add(normalize(ex)));
    });

    const selectedCourseIds        = new Set(selectedCourses.map(sc => normalize(sc.data.id)));
    const selectedCourseCategories = new Set(selectedCourses.map(sc => normalize(sc.data.category)));

    // ---- コース描画（グレーアウトは非表示） ----
    clist.innerHTML = "";
    let lastCategory = null;

    masterData.courses.forEach((c, index) => {
      const cg = normalize(c.gender);
      if (cg !== "共通" && cg !== "全員" && cg !== normalize(gender)) return;

      const uniqueId    = `course-${index}`;
      const isAgeBanned = c.ageLimit && age > 0 && age > c.ageLimit;
      const isExcluded  = bannedItems.has(normalize(c.name))
                       || bannedItems.has(normalize(c.id))
                       || bannedItems.has(normalize(c.category));
      const isSelected  = selectedCourses.some(sc => sc.id === uniqueId);
      const isBanned    = isAgeBanned || (isExcluded && !isSelected);

      // グレーアウト対象は非表示（display:noneはCSSで対応済み）
      // カテゴリラベルは表示するアイテムが存在する場合のみ出す
      if (!isBanned && c.category !== lastCategory) {
        const catLabel = document.createElement('div');
        catLabel.className = 'category-label';
        catLabel.textContent = c.category;
        clist.appendChild(catLabel);
        lastCategory = c.category;
      }

      const div = document.createElement('div');
      div.className = 'item-card' + (isBanned ? ' disabled' : '') + (isSelected ? ' selected' : '');
      div.innerHTML = buildCardInner(c, isFirst);
      div.onclick = () => { if (!isBanned) toggleItem({ id: uniqueId, data: c }, 'course'); };
      clist.appendChild(div);
    });

    // ---- オプション描画 ----
    if (selectedCourses.length === 0) {
      oSection.style.display     = 'none';
      oPlaceholder.style.display = 'block';
      oPlaceholder.innerHTML     = '<div class="loading-msg">コースを選択するとオプションが表示されます</div>';
      updateTotal();
      return;
    }

    olist.innerHTML = "";
    let anyOption = false;

    masterData.options.forEach((o, index) => {
      const og = normalize(o.gender);
      if (og !== "共通" && og !== "全員" && og !== normalize(gender)) return;

      const cond = o.condition || ["全て"];
      const isAllCond = cond.length === 0 || cond.includes("全て") || cond.includes("全員");
      if (!isAllCond) {
        const condMet = cond.some(c =>
          selectedCourseIds.has(normalize(c)) || selectedCourseCategories.has(normalize(c))
        );
        if (!condMet) return;
      }

      const isExcluded = bannedItems.has(normalize(o.name))
                      || bannedItems.has("op." + normalize(o.name))
                      || bannedItems.has(normalize(o.id));
      const uniqueId   = `option-${index}`;
      const isSelected = selectedOptions.some(so => so.id === uniqueId);
      const isBanned   = isExcluded && !isSelected;

      const div = document.createElement('div');
      // オプションカードは専用クラスで差別化
      div.className = 'item-card option-card' + (isBanned ? ' disabled' : '') + (isSelected ? ' selected' : '');
      div.innerHTML = buildCardInner(o, isFirst);
      div.onclick = () => { if (!isBanned) toggleItem({ id: uniqueId, data: o }, 'option'); };
      olist.appendChild(div);
      anyOption = true;
    });

    if (anyOption) {
      oSection.style.display     = 'block';
      oPlaceholder.style.display = 'none';
    } else {
      oSection.style.display     = 'none';
      oPlaceholder.style.display = 'block';
      oPlaceholder.innerHTML     = '<div class="loading-msg">このコースに追加できるオプションはありません</div>';
    }

    updateTotal();
  }

  function toggleItem(itemObj, type) {
    if (type === 'course') {
      const idx = selectedCourses.findIndex(sc => sc.id === itemObj.id);
      if (idx > -1) { selectedCourses.splice(idx, 1); selectedOptions = []; }
      else          { selectedCourses.push(itemObj); }
    } else {
      const idx = selectedOptions.findIndex(so => so.id === itemObj.id);
      if (idx > -1) selectedOptions.splice(idx, 1);
      else          selectedOptions.push(itemObj);
    }
    filterList();
  }

  function updateTotal() {
    const isFirst = document.getElementById('userStatus').value === 'はじめて';
    let t = 0, p = 0;
    selectedCourses.forEach(c => {
      t += c.data.time;
      p += (isFirst && c.data.firstPrice && c.data.firstPrice < c.data.price)
        ? c.data.firstPrice : c.data.price;
    });
    selectedOptions.forEach(o => {
      t += o.data.time;
      p += (isFirst && o.data.firstPrice && o.data.firstPrice < o.data.price)
        ? o.data.firstPrice : o.data.price;
    });
    document.getElementById('displayTime').innerText  = formatTimeDisplay(t);
    document.getElementById('displayPrice').innerText = p.toLocaleString();
    return { t, p };
  }

  function formatTimeDisplay(min) {
    const m = parseInt(min) || 0;
    if (m === 0) return "0分";
    const h    = Math.floor(m / 60);
    const mins = m % 60;
    if (h > 0 && mins > 0) return h + "時間" + mins + "分";
    if (h > 0)              return h + "時間";
    return mins + "分";
  }

  function goToStep2() {
    const status  = document.getElementById('userStatus').value;
    const age     = document.getElementById('userAge').value;
    const gender  = document.getElementById('gender').value;
    const isFirst = status === 'はじめて';

    if (!status) { alert("ご利用回数をお選びください。"); return; }
    if (!age)    { alert("年齢をご入力ください。"); return; }
    if (!gender) { alert("性別をお選びください。"); return; }
    if (selectedCourses.length === 0) { alert("コースをお選びください。"); return; }

    const stats = updateTotal();

    let summary  = `【セルフィール新宿 予約内容】\n`;
    summary     += `ご利用：${status}\n`;
    summary     += `年齢：${age}歳\n`;
    summary     += `性別：${gender}\n\n`;
    summary     += `■メニュー\n`;
    selectedCourses.forEach(c => {
      const p = (isFirst && c.data.firstPrice && c.data.firstPrice < c.data.price)
        ? c.data.firstPrice : c.data.price;
      summary += `・${c.data.name} (${formatTimeDisplay(c.data.time)}) / ¥${p.toLocaleString()}\n`;
    });
    selectedOptions.forEach(o => {
      const p = (isFirst && o.data.firstPrice && o.data.firstPrice < o.data.price)
        ? o.data.firstPrice : o.data.price;
      summary += `・${o.data.name}`;
      if (o.data.time > 0) summary += ` (${formatTimeDisplay(o.data.time)})`;
      summary += ` / ¥${p.toLocaleString()}\n`;
    });
    summary += `\n合計：${formatTimeDisplay(stats.t)} / ¥${stats.p.toLocaleString()}`;

    document.getElementById('summaryText').innerText = summary;

    const lineText = encodeURIComponent(summary + "\n\n▼ セルフィール新宿 公式LINE\n" + LINE_URL);
    document.getElementById('lineShareBtn').href = `https://line.me/R/share?text=${lineText}`;

    document.getElementById('step1').style.display = "none";
    document.getElementById('step2').style.display = "block";
    window.scrollTo(0, 0);
  }

  function backToStep1() {
    document.getElementById('step2').style.display = "none";
    document.getElementById('step1').style.display = "block";
    window.scrollTo(0, 0);
  }

  function copyToClipboard() {
    const text = document.getElementById('summaryText').innerText;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        alert("コピーしました！予約フォームへ貼り付けてください。");
      }).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity  = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try {
      document.execCommand('copy');
      alert("コピーしました！予約フォームへ貼り付けてください。");
    } catch (e) {
      alert("コピーに失敗しました。手動でコピーしてください。");
    }
    document.body.removeChild(ta);
  }
</script>
</body>
</html>
