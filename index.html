<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SelFeel 予約コンシェルジュ</title>
  <style>
    :root { --gold: #b8a07e; --dark-gold: #8a7a66; --bg-creme: #fdfaf5; --text: #4a4a4a; }
    body { font-family: sans-serif; background-color: #f8f7f2; color: var(--text); padding: 10px; line-height: 1.4; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: var(--gold); border-bottom: 2px solid #f0ece4; padding-bottom: 10px; margin-bottom: 20px; }
    .section { margin-bottom: 20px; padding: 15px; border: 1px solid #f0ece4; border-radius: 10px; }
    .step-title { font-weight: bold; color: var(--dark-gold); margin-bottom: 10px; display: flex; align-items: center; }
    .step-badge { background: var(--gold); color: white; border-radius: 50%; width: 24px; height: 24px; display: inline-flex; justify-content: center; align-items: center; margin-right: 10px; font-size: 12px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; font-size: 16px; }
    .item-card { display: flex; align-items: center; padding: 12px; border: 1px solid #f2f2f2; margin-bottom: 8px; border-radius: 10px; cursor: pointer; border-left: 5px solid transparent; transition: 0.2s; }
    .selected { border-left-color: var(--gold); background-color: var(--bg-creme); border-color: #eaddca; }
    .disabled { opacity: 0.3; pointer-events: none; background-color: #f9f9f9; filter: grayscale(1); }
    .price-tag { margin-left: auto; color: var(--gold); font-weight: bold; }
    .time-tag { font-size: 12px; color: #888; display: block; }
    .total-area { background: var(--bg-creme); padding: 20px; border-radius: 10px; text-align: center; margin-top: 20px; border: 1px solid #eaddca; }
    .submit-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #d4af37, #b8a07e); color: white; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1.1em; }
    .summary-box { background: #faf9f5; padding: 15px; border-radius: 8px; border: 1px dashed #dcd8c0; text-align: left; white-space: pre-wrap; font-size: 14px; margin-bottom: 10px; }
  </style>
</head>
<body>
<div class="container">
  <h2>SelFeel 予約コンシェルジュ</h2>
  
  <div id="step1">
    <div class="section">
      <div class="step-title"><span class="step-badge">1</span>お客様情報</div>
      <select id="userStatus">
        <option value="">ご利用回数</option>
        <option value="初回">はじめて</option>
        <option value="再来">2回目以降</option>
      </select>
      <input type="text" id="userName" placeholder="お名前">
      <input type="number" id="userAge" placeholder="年齢（半角数字）" oninput="filterList()">
      <select id="gender" onchange="handleGenderChange()">
        <option value="">性別を選択してください</option>
        <option value="男性">男性</option>
        <option value="女性">女性</option>
      </select>
    </div>

    <div class="section">
      <div class="step-title"><span class="step-badge">2</span>メニュー</div>
      <div id="courseList">性別を選択してください</div>
      <div id="optionList" style="margin-top:20px;"></div>
    </div>

    <div class="total-area">
      <div style="font-weight: bold; margin-bottom:10px; font-size: 1.1em;">
        合計: <span id="displayTime">0分</span> / ¥<span id="displayPrice">0</span>
      </div>
      <button class="submit-btn" onclick="goToStep2()">空き状況の確認へ進む</button>
    </div>
  </div>

  <div id="step2" style="display:none;">
    <div class="section">
      <div class="step-title"><span class="step-badge">A</span>予約内容の確認</div>
      <div id="summaryText" class="summary-box"></div>
      <button class="submit-btn" style="background:#4a4a4a;" onclick="copyToClipboard()">内容をコピーする</button>
    </div>
    <button onclick="location.reload()" style="background:none; border:none; color:gray; cursor:pointer; text-decoration:underline; width:100%; margin-top:20px;">← 最初からやり直す</button>
  </div>
</div>

<script>
  let masterData = { courses: [], options: [], exclusionRules: {} };
  let selectedCourses = [];
  let selectedOptions = [];

  // ★GASのURL（最新のものに貼り替えてください）
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyF-Ctolb_N0pTr3c0MG-kGW58srbLNf7DBO_fdAFs4Z8fngImhlq_jFFjHNsU7AYws/exec";

  window.onload = () => {
    const script = document.createElement('script');
    script.src = GAS_URL + (GAS_URL.indexOf('?') > -1 ? '&' : '?') + "callback=handleData";
    document.body.appendChild(script);
  };

  window.handleData = (data) => {
    masterData = data;
    filterList();
  };

  function handleGenderChange() {
    selectedCourses = [];
    selectedOptions = [];
    filterList();
  }

  function filterList() {
    const gender = document.getElementById('gender').value;
    const age = parseInt(document.getElementById('userAge').value) || 0;
    const clist = document.getElementById('courseList');
    const olist = document.getElementById('optionList');

    if (!gender) {
      clist.innerHTML = "性別を選択してください";
      olist.innerHTML = "";
      updateTotal();
      return;
    }

    // 排他ルール準備
    let bannedNames = [];
    selectedCourses.concat(selectedOptions).forEach(item => {
      if (masterData.exclusionRules[item.data.name]) {
        bannedNames = bannedNames.concat(masterData.exclusionRules[item.data.name]);
      }
    });

    // コース描画
    clist.innerHTML = "<label style='font-size:0.8em; color:gray;'>コースを選択</label>";
    masterData.courses.forEach((c, i) => {
      if (c.gender !== "共通" && c.gender !== "全員" && c.gender !== gender) return;

      // 年齢制限チェック（「49歳以下」などのロジック）
      const isAgeBanned = c.ageLimit && age > 0 && age > c.ageLimit;
      const isExclusionBanned = bannedNames.includes(c.name);
      const isSelected = selectedCourses.some(sc => sc.id === `c-${i}`);

      const div = document.createElement('div');
      div.className = 'item-card' + (isAgeBanned || isExclusionBanned ? ' disabled' : '') + (isSelected ? ' selected' : '');
      div.innerHTML = `<div><b>${c.name}</b><span class="time-tag">${c.time}分</span></div><span class="price-tag">¥${c.price.toLocaleString()}</span>`;
      div.onclick = () => { if(!isAgeBanned && !isExclusionBanned) toggleItem({id:`c-${i}`, data:c}, 'course'); };
      clist.appendChild(div);
    });

    // オプション描画
    olist.innerHTML = selectedCourses.length > 0 ? "<label style='font-size:0.8em; color:gray;'>オプションを追加（任意）</label>" : "";
    if (selectedCourses.length > 0) {
      masterData.options.forEach((o, i) => {
        if (o.gender !== "共通" && o.gender !== "全員" && o.gender !== gender) return;
        
        const isExclusionBanned = bannedNames.includes(o.name) || bannedNames.includes("op." + o.name);
        const isSelected = selectedOptions.some(so => so.id === `o-${i}`);

        const div = document.createElement('div');
        div.className = 'item-card' + (isExclusionBanned ? ' disabled' : '') + (isSelected ? ' selected' : '');
        div.innerHTML = `<div><b>${o.name}</b><span class="time-tag">${o.time}分</span></div><span class="price-tag">¥${o.price.toLocaleString()}</span>`;
        div.onclick = () => { if(!isExclusionBanned) toggleItem({id:`o-${i}`, data:o}, 'option'); };
        olist.appendChild(div);
      });
    }
    updateTotal();
  }

  function toggleItem(item, type) {
    let target = (type === 'course') ? selectedCourses : selectedOptions;
    const idx = target.findIndex(x => x.id === item.id);
    if (idx > -1) {
      target.splice(idx, 1);
      if(type === 'course') selectedOptions = []; // コース変更時はオプションリセット
    } else {
      target.push(item);
    }
    filterList();
  }

  function updateTotal() {
    let t = 0, p = 0;
    selectedCourses.concat(selectedOptions).forEach(x => {
      t += x.data.time;
      p += x.data.price;
    });
    document.getElementById('displayTime').innerText = t + "分";
    document.getElementById('displayPrice').innerText = p.toLocaleString();
  }

  function goToStep2() {
    const status = document.getElementById('userStatus').value;
    const name = document.getElementById('userName').value;
    const age = document.getElementById('userAge').value;
    const gender = document.getElementById('gender').value;

    if (!gender || selectedCourses.length === 0 || !name) {
      return alert("未入力の項目、またはコースの選択がありません。");
    }

    let summary = `【SelFeel 予約内容確認】\n`;
    summary += `ご利用：${status}\n`;
    summary += `お名前：${name}様 (${age}歳/${gender})\n\n`;
    summary += `■選択メニュー\n`;
    selectedCourses.concat(selectedOptions).forEach(x => {
      summary += `・${x.data.name} (${x.data.time}分) / ¥${x.data.price.toLocaleString()}\n`;
    });
    
    let t = 0, p = 0;
    selectedCourses.concat(selectedOptions).forEach(x => { t += x.data.time; p += x.data.price; });
    summary += `\n合計：${t}分 / ¥${p.toLocaleString()}`;

    document.getElementById('summaryText').innerText = summary;
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    window.scrollTo(0,0);
  }

  function copyToClipboard() {
    const text = document.getElementById('summaryText').innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert("コピーしました！空き状況を確認し、予約フォームへ貼り付けてください。");
    });
  }
</script>
</body>
</html>
