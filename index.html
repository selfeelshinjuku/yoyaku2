<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SelFeel 予約コンシェルジュ</title>

<style>
body { font-family: sans-serif; background:#f8f7f2; padding:10px;}
.container { max-width:600px; margin:auto; background:#fff; padding:20px; border-radius:12px;}
.item-card { padding:10px; border:1px solid #ddd; margin-bottom:5px; cursor:pointer;}
.selected { background:#fdfaf5;}
.disabled { opacity:0.3; pointer-events:none;}
</style>
</head>

<body>
<div class="container">

<h2>予約コンシェルジュ</h2>

<select id="gender" onchange="handleGenderChange()">
<option value="">性別選択</option>
<option value="男性">男性</option>
<option value="女性">女性</option>
</select>

<input type="number" id="userAge" placeholder="年齢" oninput="filterList()">

<div id="courseList"></div>
<div id="optionList"></div>

</div>

<script>

let masterData = { courses: [], options: [], exclusionRules: {} };
let selectedCourses = [];
let selectedOptions = [];

// ★ここだけ自分のURLに
const GAS_URL = "https://script.google.com/macros/s/AKfycbzUtV896SlQnsSnxOPWR0PVMRVlIcqTKodqSq51_n53aoB1XHW02q-SDDH7zzuSxJUm/exec";

// ★文字ゆれ対策
const normalize = (str) => String(str || "").replace(/\s+/g, "").trim();

window.onload = () => {
  const script = document.createElement('script');
  script.src = GAS_URL + "?callback=handleData";
  script.onerror = () => alert("GAS接続エラー");
  document.body.appendChild(script);
};

window.handleData = (data) => {
  console.log("取得データ", data);

  if (data.error) {
    alert("GASエラー：" + data.error);
    return;
  }

  masterData = data;
};

function handleGenderChange() {
  selectedCourses = [];
  selectedOptions = [];
  filterList();
}

function filterList() {

  const gender = normalize(document.getElementById('gender').value);
  const age = parseInt(document.getElementById('userAge').value);

  const clist = document.getElementById('courseList');
  const olist = document.getElementById('optionList');

  if (!gender) {
    clist.innerHTML = "性別選択してください";
    olist.innerHTML = "";
    return;
  }

  clist.innerHTML = "<b>コース</b>";

  masterData.courses.forEach((c, i) => {

    const cg = normalize(c.gender);

    if (cg !== "共通" && cg !== "全員" && cg !== gender) return;

    const isAgeBanned = c.ageLimit && age && age > c.ageLimit;

    const div = document.createElement('div');
    div.className = 'item-card' + (isAgeBanned ? ' disabled' : '');
    div.innerText = c.name;

    div.onclick = () => {
      selectedCourses = [{id:i, data:c}];
      selectedOptions = [];
      filterList();
    };

    clist.appendChild(div);
  });

  if (selectedCourses.length === 0) {
    olist.innerHTML = "";
    return;
  }

  olist.innerHTML = "<b>オプション</b>";

  masterData.options.forEach((o, i) => {

    const og = normalize(o.gender);

    if (og !== "共通" && og !== "全員" && og !== gender) return;

    const div = document.createElement('div');
    div.className = 'item-card';
    div.innerText = o.name;

    div.onclick = () => {
      selectedOptions.push({id:i, data:o});
      filterList();
    };

    olist.appendChild(div);
  });

}

</script>
</body>
</html>
