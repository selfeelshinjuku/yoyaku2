<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelFeel 予約コンシェルジュ</title>
    <style>
        body { font-family: sans-serif; background-color: #f9f7f2; padding: 20px; color: #4a4a4a; }
        .container { background: #fff; max-width: 500px; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #b5a47e; font-size: 1.5rem; }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 5px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        button { background: #b5a47e; color: white; border: none; font-size: 18px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>SelFeel 予約コンシェルジュ</h1>
    <form id="reservationForm">
        <div style="margin-bottom:15px;"><span style="background:#b5a47e; color:#fff; padding:2px 8px; border-radius:50%; margin-right:5px;">1</span>お客様情報をご入力ください</div>
        <input type="text" name="name" placeholder="お名前" required>
        <select name="course" required>
            <option value="">コースを選択してください</option>
            <option value="60min">スタンダード 60分</option>
            <option value="90min">プレミアム 90分</option>
            <option value="120min">ラグジュアリー 120分</option>
        </select>
        <button type="submit" id="submitBtn">予約を送信する</button>
    </form>
</div>
<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx1xQzdKXhJaYZnwtHVvu_hS64Lr--hYpfWO3PH6dn_kFf2OVOlZPNG6bYTJa_z5Nrr/exec";

    document.getElementById('reservationForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = "送信中...";
        btn.disabled = true;
        const formData = new FormData(this);
        const data = {};
        formData.forEach((value, key) => { data[key] = value });

        fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify(data),
            mode: "no-cors"
        }).then(() => {
            alert("送信が完了しました。");
            btn.innerText = "送信完了";
        }).catch(() => {
            alert("エラーが発生しました。");
            btn.disabled = false;
            btn.innerText = "再試行";
        });
    });
</script>
</body>
</html>
